name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build client
        run: npm run build:client

      - name: Package
        run: npm run pack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─── SignPath Code Signing (optional) ───
      # To remove SmartScreen warning, sign up at https://signpath.io for free
      # open-source code signing. After approval, add these GitHub secrets:
      #   SIGNPATH_API_TOKEN  - your SignPath API token
      #   SIGNPATH_ORG_ID     - your organization ID
      # Then uncomment the steps below.
      #
      # - name: Sign with SignPath
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
      #     project-slug: personal-note-table
      #     signing-policy-slug: release-signing
      #     input-artifact-path: release/PersonalNoteTable Setup ${{ github.ref_name }}.exe
      #     output-artifact-path: release/PersonalNoteTable Setup ${{ github.ref_name }}-signed.exe
      #     wait-for-completion: true

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: release/*.exe
          compression-level: 0

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: meta-${{ matrix.os }}
          path: |
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: warn
          compression-level: 0

  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            installer-*/*
            meta-*/*
